name: Materialize stable Termux/Web snapshot

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize-stable.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct stable reference sources
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".bootstrap/monitor_v5.py.gz.b64.part*" > /dev/null; then
            echo "Bootstrap payload already consumed."
            exit 0
          fi

          mkdir -p termux web
          cat .bootstrap/monitor_v5.py.gz.b64.part* | base64 -d | gzip -d > termux/monitor_v5.py
          cat .bootstrap/dashboard_v5_rooms.py.gz.b64.part* | base64 -d | gzip -d > web/dashboard_v5_rooms.py

          python -m py_compile termux/monitor_v5.py
          python -m py_compile web/dashboard_v5_rooms.py

      - name: Commit stable reference sources
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".bootstrap/monitor_v5.py.gz.b64.part*" > /dev/null; then
            exit 0
          fi

          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Materialize stable Termux/Web reference sources"
          git push
