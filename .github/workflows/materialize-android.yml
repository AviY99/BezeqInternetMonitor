name: Materialize and validate native Android implementation

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/android-full.tgz.b64.part*'
      - '.github/workflows/materialize-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Reconstruct Android source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/android-full.tgz.b64.part01
          cat .bootstrap/android-full.tgz.b64.part* | tr -d '\r\n ' | base64 -d > /tmp/android-full.tgz
          gzip -t /tmp/android-full.tgz
          rm -rf android
          tar -xzf /tmp/android-full.tgz
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/aviy99/bezeqinternetmonitor/repository/MonitoringRepository.kt

          # API 37 is not currently published on the stable SDK channel available to the hosted runner.
          # Build the identical implementation against stable API 36.
          sed -i 's/compileSdk = 37/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: BezeqInternetMonitor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android .bootstrap
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Implement full native Android monitor v0.2.0"
          git push
